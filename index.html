<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1d1630">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Do Re Lama</title>
  <link rel="icon" href="img/lama/coin.png">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Nunito';
      src: url('fonts/nunito-latin.woff2') format('woff2');
      font-weight: 200 1000;
      font-display: block;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1630; overscroll-behavior: none; }
    canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Do Re Lama: speel gitaar en laat de lama springen"></canvas>
  <noscript style="color:#fff;font:20px system-ui;position:fixed;inset:0;display:grid;place-items:center">Do Re Lama heeft JavaScript nodig.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
